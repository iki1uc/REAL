<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GHOST-SCAN – Systemlage</title>

<style>
  body { font-family: Arial; background:#111; color:#eee; }
  h1 { text-align:center; }
  .respo-box {
    border:1px solid #444;
    padding:10px;
    margin:10px;
    background:#222;
  }
  .ok { color:#00ff88; }
  .help { color:#ffcc00; }
  .error { color:#ff4444; }
</style>
</head>
<button onclick="REAL_RESPO_POPUP(REAL_RESPO())">REAL‑RESPO Popup</button>
<button onclick="REAL_RESPO_HEATMAP(REAL_RESPO())">REAL‑Heatmap</button>
<button onclick="REAL_RESPO_3D(REAL_RESPO())">REAL‑3D Kugel</button>
<button onclick="REAL_RESPO_QMOVE(REAL_RESPO())">REAL‑Q‑Move</button>

<body>

<h1>GHOST‑SCAN – Systemlage</h1>

<div id="output"></div>

<script src="/fin.e.js"></script>

<script>
// ------------------------------------------------------
// NC‑CMD PANEL (sichtbare Ausgabe)
// ------------------------------------------------------
const panel = document.createElement("div");
panel.id = "ncPanel";
panel.style.position = "fixed";
panel.style.bottom = "10px";
panel.style.right = "10px";
panel.style.width = "320px";
panel.style.height = "260px";
panel.style.background = "#000000cc";
panel.style.border = "1px solid #444";
panel.style.padding = "10px";
panel.style.color = "#eee";
panel.style.fontFamily = "Arial";
panel.style.overflowY = "auto";
panel.style.zIndex = "9999";
panel.innerHTML = "<h3>NC‑CMD Monitor</h3>";
document.body.appendChild(panel);

// ------------------------------------------------------
// STATUS‑LEDs
// ------------------------------------------------------
function led(color){
  return `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:6px;"></span>`;
}

// ------------------------------------------------------
// FEHLERANZEIGE
// ------------------------------------------------------
function log(msg, type="info"){
  const colors = {
    info: "#00aaff",
    ok: "#00ff88",
    warn: "#ffcc00",
    error: "#ff4444"
  };
  panel.innerHTML += `<div style="margin:4px 0;">${led(colors[type])}${msg}</div>`;
}

// ------------------------------------------------------
// PIPELINE-MESSUNG (0 → 1 → 2 → 0)
// ------------------------------------------------------
function NC_PIPELINE_MEASURE() {
  log("Messung: Station 0 → Aktion / Gründer / GPU", "info");
  log("Kompetenz: engine.power", "ok");

  log("Messung: Station 1 → Aufgabe / CPU", "info");
  log("Kompetenz: engine.logic", "ok");

  log("Messung: Station 2 → Regel / Watson / RAM", "info");
  log("Kompetenz: engine.memory", "ok");

  log("Messung: Station 0 → Rückführung / ROM / 81.tmp", "info");
  log("Kompetenz: 81.tmp", "ok");

  log("Zyklus abgeschlossen: 0 → 1 → 2 → 0", "ok");
}

// ------------------------------------------------------
// REAL.json SYNC
// ------------------------------------------------------
async function syncREAL(){
  try {
    const res = await fetch("/REAL/REAL.json");
    const data = await res.json();
    log("REAL.json geladen: ID " + data.ID, "ok");
    return data;
  } catch(e){
    log("REAL.json FEHLT", "error");
    return null;
  }
}

// ------------------------------------------------------
// GHOST‑SCAN Bindung
// ------------------------------------------------------
async function ghostScan(){
  try {
    await fetch("/fin.e.js");
    log("GHOST‑SCAN Engine geladen", "ok");
  } catch(e){
    log("GHOST‑SCAN Engine FEHLT", "error");
  }
}

// ------------------------------------------------------
// NC‑CMD ENGINE‑CHECK
// ------------------------------------------------------
function NC_CMD_RUN(){
  log("NC‑CMD gestartet", "info");

  log("engine.root → 81.tmp.check(a)", "ok");
  log("engine.cross → X81.check(e)", "ok");
  log("engine.query → Q81.check(d)", "ok");
  log("engine.transport → TMP.check(u)", "warn");

  log("respo.core → respo.check(E)", "ok");
  log("respo.arg → arg.check(t)", "ok");

  log("layer.public → layer.check(l)", "ok");
  log("layer.cross → cross.check(x)", "ok");
  log("layer.vector → vector.check(v)", "ok");

  log("matrix.81 → matrix.check(81)", "ok");
  log("matrix.9 → matrix.check(9)", "ok");

  log("pipeline.core → pipeline.check(4)", "ok");
  log("pipeline.dual → pipeline.check(2)", "warn");

  log("pq.core → pq.check(e)", "ok");
}

// ------------------------------------------------------
// LIVE‑MONITOR (alle 5 Sekunden)
// ------------------------------------------------------
setInterval(() => {
  log("Auto‑Scan läuft …", "info");
  NC_CMD_RUN();
  NC_PIPELINE_MEASURE();   // Pipeline-Messung hinzugefügt
}, 5000);

// ------------------------------------------------------
// Start: REAL‑SYNC + GHOST‑SCAN + erster NC‑CMD
// ------------------------------------------------------
(async () => {
  await syncREAL();
  await ghostScan();
  NC_CMD_RUN();
  NC_PIPELINE_MEASURE();
})();
</script>

</body>
</html>
