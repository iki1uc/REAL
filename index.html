<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GHOST-SCAN – Systemlage</title>

<style>
  body { font-family: Arial; background:#111; color:#eee; }
  h1 { text-align:center; }
  .respo-box {
    border:1px solid #444;
    padding:10px;
    margin:10px;
    background:#222;
  }
  .ok { color:#00ff88; }
  .help { color:#ffcc00; }
  .error { color:#ff4444; }
</style>
</head>

<body>

<h1>GHOST‑SCAN – Systemlage</h1>

<div id="output"></div>

<script src="/fin.e.js"></script>

<script>
// ------------------------------------------------------
// NC 360° Drehung
// ------------------------------------------------------
function NC_360() {
  const root = document.body;
  root.style.transition = "transform 1.2s ease-in-out";
  root.style.transform = "rotateY(360deg)";
  setTimeout(() => {
    root.style.transform = "rotateY(0deg)";
  }, 1300);
}

// ------------------------------------------------------
// NC-CMD Trigger (bindet dein NC.command)
// ------------------------------------------------------
function NC_360_CMD() {
  NC_360();

  console.log("NC-CMD: engine.root =", "81.tmp.check(a)");
  console.log("NC-CMD: engine.cross =", "X81.check(e)");
  console.log("NC-CMD: engine.query =", "Q81.check(d)");
  console.log("NC-CMD: engine.transport =", "TMP.check(u)");

  console.log("NC-CMD: respo.core =", "respo.check(E)");
  console.log("NC-CMD: respo.arg =", "arg.check(t)");

  console.log("NC-CMD: layer.public =", "layer.check(l)");
  console.log("NC-CMD: layer.cross =", "cross.check(x)");
  console.log("NC-CMD: layer.vector =", "vector.check(v)");

  console.log("NC-CMD: matrix.81 =", "matrix.check(81)");
  console.log("NC-CMD: matrix.9 =", "matrix.check(9)");

  console.log("NC-CMD: pipeline.core =", "pipeline.check(4)");
  console.log("NC-CMD: pipeline.dual =", "pipeline.check(2)");

  console.log("NC-CMD: pq.core =", "pq.check(e)");
}

// ------------------------------------------------------
// Button einfügen
// ------------------------------------------------------
const btn = document.createElement("button");
btn.textContent = "NC 360° CMD";
btn.style.padding = "10px 20px";
btn.style.margin = "10px";
btn.style.fontSize = "16px";
btn.onclick = NC_360_CMD;

document.body.prepend(btn);
</script>


</body>
</html>
